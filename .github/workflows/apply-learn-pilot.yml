name: Apply Learn template pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-learn-pilot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply template to pilot article and lint
        shell: bash
        run: |
          pip install --quiet --break-system-packages beautifulsoup4 || pip install --quiet beautifulsoup4
          python3 tools/pilot/apply.py
          python3 tools/learn_lint.py en/learn/photochromic-vs-polarized-sunglasses.html
          git hash-object en/learn/photochromic-vs-polarized-sunglasses.html
          rm -rf tools/pilot .github/workflows/apply-learn-pilot.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "Dao Tuan Anh"
          git config user.email "tuananh.a1202@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Learn pilot: photochromic-vs-polarized on the new article template" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01NpKWFnAoGHpRpSryGSGP4D"
          git push
