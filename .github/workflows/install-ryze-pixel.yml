name: Install Ryze Pixel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-ryze-pixel.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add pixel before closing head on every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          snippet = '<script async src="https://px.get-ryze.ai/px.js" data-key="rz_pk_4898090d56df06cda42bdeffa6602a82"></script>'
          changed = 0
          for path in sorted(Path('.').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              if snippet in text or '</head>' not in text:
                  continue
              text = text.replace('</head>', snippet + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
              changed += 1
          print(f'Updated {changed} HTML files')
          PY
          rm -f .github/workflows/install-ryze-pixel.yml
      - name: Commit installation
        shell: bash
        run: |
          git config user.name "Ryze Agent"
          git config user.email "agent@get-ryze.ai"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Ryze Pixel"
          git push
